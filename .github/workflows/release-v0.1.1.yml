name: Publish v0.1.1

on:
  push:
    branches:
      - "release-v0.1.1"

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/release-v0.1.1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4

      - name: Verify release whitelist and hashes
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets/v0.1.1

          test "$(find . -maxdepth 1 -type f -name 'Astar.DatabaseBypass_v0.1.1_SPT-4.1.*.zip' | wc -l)" -eq 4
          test "$(find . -maxdepth 1 -type f -name '*4.0*' | wc -l)" -eq 0

          sha256sum -c SHA256.txt
          test "$(grep -c '^Statistics: malicious=0; suspicious=0;' VIRUSTOTAL.txt)" -eq 4

      - name: Create GitHub Release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v0.1.1 \
            --target "$GITHUB_SHA" \
            --title "Astar.DatabaseBypass v0.1.1" \
            --notes-file release-assets/v0.1.1/RELEASE_NOTES.md \
            release-assets/v0.1.1/Astar.DatabaseBypass_v0.1.1_SPT-4.1.0.zip \
            release-assets/v0.1.1/Astar.DatabaseBypass_v0.1.1_SPT-4.1.1.zip \
            release-assets/v0.1.1/Astar.DatabaseBypass_v0.1.1_SPT-4.1.2.zip \
            release-assets/v0.1.1/Astar.DatabaseBypass_v0.1.1_SPT-4.1.3.zip \
            release-assets/v0.1.1/SHA256.txt \
            release-assets/v0.1.1/VIRUSTOTAL.txt
